@if (photos().length === 0) {

  <!-- Empty State -->
  <div class="aspect-[16/10] bg-surface rounded-sm flex items-center justify-center">
    <svg
      class="w-16 h-16 text-border"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"
      />
    </svg>
  </div>

} @else {

  <div class="grid grid-cols-1 lg:grid-cols-[1fr_104px] gap-2">

    <!-- Main Photo -->
    <div class="relative aspect-[16/10] overflow-hidden rounded-sm bg-surface">

      @if (activePhoto()?.url) {
        <img
          [src]="activePhoto()!.url"
          [alt]="'Foto do imóvel'"
          class="w-full h-full object-cover"
        />
      }

      <!-- Badges: top-left stack -->
      <div class="absolute top-4 left-4 flex flex-col gap-2">

        @if (dealTypeLabel()) {
          <span class="px-3 py-1 font-sans text-xs font-semibold text-gold-foreground rounded-full bg-gradient-gold self-start">
            {{ dealTypeLabel() }}
          </span>
        }

        @if (category()?.name) {
          <span class="px-3 py-1 font-sans text-xs text-gold border border-gold/40 bg-background/70 backdrop-blur-sm rounded-full self-start">
            {{ category()!.name }}
          </span>
        }

      </div>
    </div>

    <!-- Thumbnails: row on mobile, column on desktop -->
    <div
      class="flex flex-row lg:flex-col gap-2 overflow-x-auto lg:overflow-x-visible pb-1 lg:pb-0"
      role="list"
      aria-label="Fotos do imóvel"
    >
      @for (photo of photos(); track photo.id) {
        <button
          type="button"
          role="listitem"
          [class]="thumbnailClass(photo)"
          (click)="activePhoto.set(photo)"
          [attr.aria-label]="'Ver foto ' + ($index + 1)"
          [attr.aria-pressed]="activePhoto()?.id === photo.id"
        >
          <img
            [src]="photo.url"
            [alt]="'Miniatura ' + ($index + 1)"
            class="w-full h-full object-cover"
            loading="lazy"
          />
        </button>
      }
    </div>

  </div>

}
