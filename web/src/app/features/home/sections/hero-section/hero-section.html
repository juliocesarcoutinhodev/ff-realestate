<section
  class="relative min-h-screen bg-background bg-cover bg-center flex items-end md:items-center"
  aria-label="Hero"
  [style.background-image]="backgroundImage()"
>
  <!-- Gradient overlay -->
  <div class="absolute inset-0 pointer-events-none hero-overlay"></div>

  <!-- Content -->
  <div class="relative z-10 w-full max-w-6xl mx-auto px-6 pb-24 md:pb-0 pt-32 md:pt-0">

    <!-- Tagline -->
    <div class="flex items-center gap-3 mb-6" aria-hidden="true">
      <span class="block h-px w-10 bg-gold shrink-0"></span>
      <span class="font-sans text-xs text-gold uppercase tracking-[0.2em]">{{ heroTagLine() }}</span>
    </div>

    <!-- Broker name -->
    <h1 class="font-serif text-5xl md:text-7xl text-foreground leading-[1.05] mb-5">
      {{ firstName() }}<br>
      <em class="italic text-gold">{{ lastName() }}</em>
    </h1>

    <!-- CRECI line -->
    <p class="font-sans text-muted text-base md:text-lg mb-5">
      Corretor de Imóveis · CRECI-SP {{ settings()?.brokerCreci }}
    </p>

    <!-- Hero subtitle -->
    @if (settings()?.heroSubtitle) {
      <p class="font-sans text-foreground/75 text-base md:text-xl max-w-lg mb-10 leading-relaxed">
        {{ settings()?.heroSubtitle }}
      </p>
    } @else {
      <div class="mb-10"></div>
    }

    <!-- CTAs -->
    <div class="flex flex-wrap gap-4">
      <a
        routerLink="/properties"
        class="inline-flex items-center gap-2 px-8 py-4 font-sans text-sm font-medium text-gold-foreground rounded-sm transition-opacity hover:opacity-90 bg-gradient-gold"
      >
        Ver Portfólio →
      </a>
      <a
        href="#about"
        class="inline-flex items-center gap-2 px-8 py-4 font-sans text-sm font-medium text-foreground border border-foreground/30 rounded-sm transition-colors hover:border-foreground/60"
      >
        Sobre o Corretor
      </a>
    </div>
  </div>
</section>
