<section id="about" class="py-28 bg-background" aria-labelledby="about-heading">
  <div class="max-w-6xl mx-auto px-6">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-24 items-center">

      <!-- Photo column -->
      <div class="relative">
        <!-- Decorative square: must come before image to stay behind it -->
        <div
          class="absolute -bottom-4 -right-4 w-32 h-32 border-2 border-gold/60"
          aria-hidden="true"
        ></div>

        <div class="relative aspect-[3/4] overflow-hidden rounded-2xl bg-surface">
          @if (settings()?.brokerPhotoUrl) {
            <img
              [src]="settings()!.brokerPhotoUrl"
              [alt]="settings()!.brokerName + ' - Corretor de Imóveis'"
              loading="lazy"
              class="w-full h-full object-cover"
            />
          } @else {
            <div class="w-full h-full flex items-center justify-center text-border">
              <svg class="w-24 h-24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="0.75" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
              </svg>
            </div>
          }
        </div>
      </div>

      <!-- Text column -->
      <div class="flex flex-col gap-8">

        <!-- Label -->
        <div class="flex items-center gap-3" aria-hidden="true">
          <span class="block h-px w-10 bg-gold shrink-0"></span>
          <span class="font-sans text-xs text-gold uppercase tracking-[0.2em]">Sobre o Corretor</span>
        </div>

        <!-- Heading -->
        <h2 id="about-heading" class="font-serif text-4xl md:text-5xl text-foreground leading-tight">
          Uma relação construída com <em class="italic text-gold">confiança</em>
        </h2>

        <!-- Bio -->
        @if (settings()?.brokerBio) {
          <p class="font-sans text-foreground/75 text-base md:text-lg leading-relaxed whitespace-pre-line">
            {{ settings()!.brokerBio }}
          </p>
        }

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-6 pt-2">
          @for (stat of stats; track stat.value) {
            <div class="border-l-2 border-gold pl-4">
              <p class="font-serif text-3xl text-gold leading-none">{{ stat.value }}</p>
              <p class="font-sans text-sm text-muted mt-2 leading-snug">{{ stat.label }}</p>
            </div>
          }
        </div>

      </div>
    </div>
  </div>
</section>
